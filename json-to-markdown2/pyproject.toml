[project]
name = "json-to-markdown2"
version = "0.1.0"
description = "Convert nested JSON documents into readable Markdown"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
json-to-markdown2 = "json_to_markdown:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["json_to_markdown.py"]
